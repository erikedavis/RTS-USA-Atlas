name: Publish USAtlas

on:
  push:
    tags: ['V*.0A']

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the release tag and application version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^V[1-9][0-9]*\.0A$ ]]; then
            echo "::error::Only major USAtlas release tags can publish to GitHub Pages."
            exit 1
          fi
          latest=$(git tag --list 'V*.0A' --sort=-version:refname | awk '/^V[1-9][0-9]*\.0A$/ && !found {print; found=1}')
          if [[ "$GITHUB_REF_NAME" != "$latest" ]]; then
            echo "::error::Only the newest major USAtlas release can publish to GitHub Pages."
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.GITHUB_REF_NAME.slice(1);
          const manifest = JSON.parse(fs.readFileSync('data/manifest.json', 'utf8'));
          const html = fs.readFileSync('index.html', 'utf8');
          const headingVersion = html.match(/<meta name="atlas-version" content="ALPHA ([^"]+)">/)?.[1];
          if (manifest.version !== expected || headingVersion !== expected) {
            throw new Error('The release tag, data manifest, and app version must agree.');
          }
          NODE
      - name: Verify geographic data
        run: npm run test:data
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package the site
        shell: bash
        run: |
          site="$RUNNER_TEMP/atlas-pages"
          mkdir -p "$site"
          git archive HEAD index.html assets data js | tar -x -C "$site"
          printf '{"version":"%s","tag":"%s","commit":"%s"}\n' \
            "${GITHUB_REF_NAME#V}" "$GITHUB_REF_NAME" "$GITHUB_SHA" > "$site/release.json"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/atlas-pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
