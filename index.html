<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020307">
  <meta name="atlas-version" content="ALPHA 0.9P">
  <title>USAtlas | V0.9P</title>
  <script>
    try {
      if (localStorage.getItem('usatlas-appearance') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch {}
  </script>
  <link href="./assets/vendor/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/theme.css?v=09p">
  <link rel="stylesheet" href="./assets/atlas.css?v=09p">
  <link rel="stylesheet" href="./assets/phone.css?v=09p">
</head>
<body>
  <div class="app">
    <button type="button" id="appearance-toggle" aria-label="Switch to light mode. Current mode: dark.">
      <svg class="appearance-moon" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M25.8 20.2A11.4 11.4 0 0 1 11.8 6.2a11.4 11.4 0 1 0 14 14Z"/>
      </svg>
      <svg class="appearance-sun" viewBox="0 0 32 32" aria-hidden="true">
        <defs><path id="appearance-sun-ray" d="M16 1.1l1.9 6h-3.8Zm-3.7 2.7l1.1 4.5-2 .9Zm7.4 0l.9 5.4-2-.9Z"/></defs>
        <circle cx="16" cy="16" r="7.4"/>
        <use href="#appearance-sun-ray"/><use href="#appearance-sun-ray" transform="rotate(45 16 16)"/>
        <use href="#appearance-sun-ray" transform="rotate(90 16 16)"/><use href="#appearance-sun-ray" transform="rotate(135 16 16)"/>
        <use href="#appearance-sun-ray" transform="rotate(180 16 16)"/><use href="#appearance-sun-ray" transform="rotate(225 16 16)"/>
        <use href="#appearance-sun-ray" transform="rotate(270 16 16)"/><use href="#appearance-sun-ray" transform="rotate(315 16 16)"/>
      </svg>
      <span class="appearance-hint" id="appearance-hint" aria-hidden="true">Dark mode · Switch to light</span>
    </button>
    <header class="topbar">
      <button type="button" class="brand" id="home" aria-label="Reset to national view">
        <img src="./assets/brand-c14.svg" alt="USAtlas">
      </button>
      <details class="tools-menu" id="tools-menu">
        <summary class="tools-trigger" aria-label="Tools">
          <span class="tools-mobile" aria-hidden="true"><img src="./assets/brand-c14.svg" alt=""><span class="tools-chevron"></span></span>
          <span class="tools-desktop" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 4h8v5h-3v11h-2V9H8z" transform="rotate(45 12 12)"/></svg>
            <span class="tools-label">TOOLS</span>
          </span>
        </summary>
        <div class="tools-options">
          <details class="tools-section" id="layers-menu">
            <summary>LAYERS<span class="tools-chevron"></span></summary>
            <div class="tools-section-options" id="layer-options">
              <div class="tools-current" aria-current="true">STANDARD</div>
            </div>
          </details>
          <details class="tools-section" id="view-menu">
            <summary>VIEW<span class="tools-chevron"></span></summary>
            <div class="tools-section-options">
              <div class="tools-current" aria-current="true">STATISTICAL</div>
              <button type="button" data-view="geographic">GEOGRAPHIC</button>
              <button type="button" data-view="strategic">STRATEGIC</button>
            </div>
          </details>
          <button type="button" disabled>MEASURE</button>
        </div>
      </details>
      <div class="search-wrap">
        <label for="search" class="sr-only">Find a state, county or city</label>
        <input id="search" enterkeyhint="search" placeholder="Find state, county, city…" autocomplete="off" spellcheck="false">
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <span class="build-version" id="build-version"></span>
    </header>

    <div class="content">
      <main class="map-shell" aria-label="Interactive map">
        <div id="map"></div>
        <div class="gridlines" aria-hidden="true"></div>
        <div class="map-vignette" aria-hidden="true"></div>
        <div class="map-loading" id="map-loading"><span class="load-ring"></span><strong>INITIALIZING MAP</strong><small>Loading geographic layers…</small></div>
        <button type="button" id="reset-view" title="National view" aria-label="National view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11.5 12 5l7 6.5v7.7H5zM10 19v-5h4v5"/></svg>
        </button>
        <div class="map-controls">
          <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="map-layers" type="button" aria-expanded="false" aria-controls="phone-layers-menu" disabled>LAYERS</button>
        </div>
        <div class="rotation-tools rotation-north-locked" role="group" aria-label="Map rotation">
          <div class="compass-face" id="compass-face">
            <div class="compass-dial">
              <button id="compass-home" type="button" aria-label="Unlock map rotation" aria-describedby="rotation-bearing">
                <svg class="compass-rose" viewBox="0 0 100 100" aria-hidden="true">
                  <g id="compass-art">
                    <path class="compass-light" d="M50 50 50 0 57 36ZM50 50 80 20 64 43ZM50 50 64 43 100 50ZM50 50 80 80 57 64ZM50 50 50 100 43 64ZM50 50 20 80 36 57ZM50 50 36 57 0 50ZM50 50 20 20 43 36Z"/>
                    <path class="compass-shadow" d="M50 50 43 36 50 0ZM50 50 57 36 80 20ZM50 50 100 50 64 57ZM50 50 64 57 80 80ZM50 50 57 64 50 100ZM50 50 43 64 20 80ZM50 50 0 50 36 43ZM50 50 36 43 20 20Z"/>
                  </g>
                </svg>
              </button>
              <button class="compass-direction" type="button" data-bearing="0" style="--direction-y:calc(0% - var(--compass-cardinal-radius))" aria-label="North up"><span>N</span></button>
              <button class="compass-direction" type="button" data-bearing="45" style="--direction-x:26.2%;--direction-y:-26.2%" aria-label="Northeast up"><span>NE</span></button>
              <button class="compass-direction" type="button" data-bearing="90" style="--direction-x:var(--compass-cardinal-radius)" aria-label="East up"><span>E</span></button>
              <button class="compass-direction" type="button" data-bearing="135" style="--direction-x:26.2%;--direction-y:26.2%" aria-label="Southeast up"><span>SE</span></button>
              <button class="compass-direction" type="button" data-bearing="180" style="--direction-y:var(--compass-cardinal-radius)" aria-label="South up"><span>S</span></button>
              <button class="compass-direction" type="button" data-bearing="225" style="--direction-x:-26.2%;--direction-y:26.2%" aria-label="Southwest up"><span>SW</span></button>
              <button class="compass-direction" type="button" data-bearing="270" style="--direction-x:calc(0% - var(--compass-cardinal-radius))" aria-label="West up"><span>W</span></button>
              <button class="compass-direction" type="button" data-bearing="315" style="--direction-x:-26.2%;--direction-y:-26.2%" aria-label="Northwest up"><span>NW</span></button>
            </div>
            <button id="rotation-lock" type="button" aria-label="Unlock map rotation" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <g id="compass-lock-art">
                  <path class="compass-shackle" d="M7.5 12V8a4.5 4.5 0 0 1 9 0v4" fill="none" stroke="currentColor" stroke-width="2.8"/>
                  <path fill="currentColor" fill-rule="evenodd" d="M6 10.5h12a2.5 2.5 0 0 1 2.5 2.5v6.5A2.5 2.5 0 0 1 18 22H6a2.5 2.5 0 0 1-2.5-2.5V13A2.5 2.5 0 0 1 6 10.5Zm6 3a1.8 1.8 0 0 0-.8 3.4v2.4h1.6v-2.4a1.8 1.8 0 0 0-.8-3.4Z"/>
                </g>
              </svg>
            </button>
          </div>
          <div class="compass-return-swipe" aria-hidden="true"></div>
          <button id="compass-toggle" type="button" aria-controls="compass-face" aria-expanded="true" aria-label="Hide compass">
            <svg class="compass-chevron" viewBox="0 0 12 16" aria-hidden="true"><path d="m4 3 5 5-5 5"/></svg>
            <svg class="compass-peek" viewBox="0 0 100 100" aria-hidden="true"><use href="#compass-art"/></svg>
            <span class="compass-toggle-text" aria-hidden="true">Hide compass</span>
          </button>
          <button id="compass-edge-lock" type="button" aria-label="Unlock map rotation" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#compass-lock-art"/></svg>
          </button>
          <div class="compass-lock-notice" id="compass-lock-notice" role="status" hidden>Compass is locked, press L to Unlock</div>
          <span id="rotation-bearing" class="sr-only">Bearing 0 degrees</span>
        </div>
        <button type="button" class="phone-control phone-history-back" id="phone-history-back" aria-label="Back to state" hidden>
          <svg viewBox="0 0 32 26" aria-hidden="true"><path d="M30 13H3m0 0L14 2M3 13l11 11"/></svg>
          <span>BACK</span>
        </button>
        <div class="map-hud lower-left"><span id="coordinate-text">39.0°N 98.0°W</span></div>
        <span class="map-hud dev-zoom" id="zoom-text">ZOOM —</span>
        <button type="button" class="map-key-toggle" id="map-key-toggle" title="Map key" aria-label="Map key" aria-expanded="false" aria-controls="map-key">
          <svg viewBox="0 0 46 24" aria-hidden="true"><circle cx="8.5" cy="13" r="5.6"/><path d="M14 11.5H23V10h3v1.5h8V5h3v3h2.5V5H43v9.5H26V16h-3v-1.5h-9"/></svg>
        </button>
        <section class="map-key" id="map-key" aria-labelledby="map-key-heading" hidden>
          <h2 id="map-key-heading">Map key</h2>
          <p>City population</p>
          <ul id="map-key-symbols"></ul>
          <p class="map-key-tip">Select a city by its name. Select its symbol to zoom.</p>
        </section>
      </main>
      <aside class="info-panel" id="info-panel">
        <button type="button" id="sidebar-toggle" aria-controls="info-panel" aria-expanded="true" aria-label="Hide stats" title="Hide stats">
          <svg viewBox="0 0 14 20" aria-hidden="true"><path d="m4 3 6 7-6 7"/></svg>
        </button>
        <div class="panel-top">
          <button id="desktop-state-back" type="button" class="panel-action" hidden>Back</button>
          <div class="panel-buttons">
            <div id="desktop-layer-controls" class="panel-layer-controls" role="group" aria-label="Map overlays">
              <button id="toggle-counties" type="button" title="Show counties and enable county selection" aria-label="Toggle county selection" aria-pressed="false">COUNTIES</button>
              <button id="toggle-metros" type="button" title="Toggle metro areas" aria-label="Toggle metro boundaries" aria-pressed="false">METROS</button>
            </div>
            <button id="desktop-atlas-toggle" type="button" class="panel-action" aria-controls="panel-content" hidden>Atlas</button>
          </div>
          <button id="desktop-dismiss" type="button" aria-label="Clear selection and hide stats" title="Clear selection and hide stats" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          </button>
        </div>
        <div class="panel-content" id="panel-content">
          <div class="section-kicker">USA STATS</div>
          <h1>United States</h1>
        </div>
        <div class="panel-footer"><span class="pulse"></span><span id="selection-status">UNITED STATES</span></div>
      </aside>
      <button type="button" class="phone-control phone-atlas-back" id="phone-atlas-back" aria-label="Leave state atlas" hidden>
        <svg viewBox="0 0 20 12" aria-hidden="true"><path d="m3 3 7 6 7-6"/></svg>
      </button>
      <div class="phone-dock" id="phone-dock" hidden>
        <div class="phone-grip" id="phone-grip">
          <button type="button" class="phone-control" id="phone-up" aria-label="Show map tools">
            <svg viewBox="0 0 20 12" aria-hidden="true"><path d="m3 9 7-6 7 6"/></svg>
          </button>
          <button type="button" class="phone-control" id="phone-down" aria-label="Collapse map tools" hidden>
            <svg viewBox="0 0 20 12" aria-hidden="true"><path d="m3 3 7 6 7-6"/></svg>
          </button>
          <button type="button" class="phone-control" id="phone-clear" aria-label="Clear state selection" hidden>
            <svg viewBox="0 0 20 12" aria-hidden="true"><path d="m6 2 8 8m0-8-8 8"/></svg>
          </button>
        </div>
        <div class="phone-dock-body" id="phone-dock-body">
          <button type="button" class="phone-control phone-home" id="phone-home" aria-label="National view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11.5 12 5l7 6.5v7.7H5zM10 19v-5h4v5"/></svg>
          </button>
          <div class="phone-dock-row phone-tray" id="phone-tray" inert>
            <div id="phone-tray-inner"></div>
            <div class="tools-options phone-layers-menu" id="phone-layers-menu" hidden></div>
          </div>
          <div class="phone-dock-row phone-sheet" inert><div id="phone-sheet-inner">
            <button class="phone-control phone-facts-grip" type="button" id="phone-facts-grip" aria-label="Leave state atlas" hidden>
              <svg viewBox="0 0 20 12" aria-hidden="true"><path d="M2 6h16"/></svg>
            </button>
          </div></div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="./js/atlas.mjs?v=09p1"></script>
</body>
</html>
